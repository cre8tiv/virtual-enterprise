# The 25 named personas: hand-authored employees that tests and demos refer to by name.
# They are the M365 E5 sandbox's 25 licensed users. The other ~375 employees are generated
# (canonical/generator) and exist as unlicensed identities.
#
# id:            canonical employee ID (E0001-E0025; generated employees start at E0026)
# key:           stable handle used in tests, departments.yaml heads, and manager references
# upn:           derived as {first}.{last}@{domain}, lowercase ASCII
# manager:       persona key; null for the CEO
# start_date:    hire date
# extra_groups:  role-* and app-* groups beyond the department's defaults (groups.yaml)
# lifecycle:     scheduled joiner/mover/leaver event, relative to the environment's seed date
# test_purpose:  why this persona exists, i.e. what it lets a test exercise
#
# Names are invented; each first+last combination was chosen to avoid well-known people.

