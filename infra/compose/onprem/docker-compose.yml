# On-prem site ("HQ datacenter"): services that live on a private network with no inbound access.
# Requires an x86_64 host (SQL Server and Splunk Enterprise do not support arm64).
#
#   cp .env.example .env        # fill values from the operator vault
#   docker compose up -d
#   docker compose --profile tunnel up -d   # also start cloudflared for direct (non-gateway) access

name: onprem

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:-2022-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: runs every sql/init/*.sql in name order once SQL Server is healthy. Scripts must be idempotent.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:-2022-latest}
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
      SUT_READER_PASSWORD: ${SUT_READER_PASSWORD:?set in .env}
    volumes:
      - ./sql/init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        for f in /init/*.sql; do
          echo "Running $$f"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$f" -v SUT_READER_PASSWORD="$$SUT_READER_PASSWORD" || exit 1
        done
    restart: "no"

  splunk:
    image: splunk/splunk:${SPLUNK_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?set in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"   # web UI
      - "${BIND_ADDR:-127.0.0.1}:8089:8089"   # management / REST API
      - "${BIND_ADDR:-127.0.0.1}:8088:8088"   # HTTP Event Collector
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      - ./splunk/apps/ve_indexes:/opt/splunk/etc/apps/ve_indexes

  # Payroll (Phase 7b): legacy on-prem PostgreSQL, reached by the SUT through its gateway like SQL Server.
  payroll-db:
    image: postgres:${PAYROLL_POSTGRES_IMAGE_TAG:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYROLL_PG_PASSWORD:?set in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PAYROLL_PORT:-5432}:5432"
    volumes:
      - payroll-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payroll"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: runs every payroll/init/*.sql in name order once PostgreSQL is healthy. Scripts must be idempotent.
  payroll-init:
    image: postgres:${PAYROLL_POSTGRES_IMAGE_TAG:-16}
    depends_on:
      payroll-db:
        condition: service_healthy
    environment:
      PGHOST: payroll-db
      PGUSER: postgres
      PGDATABASE: payroll
      PGPASSWORD: ${PAYROLL_PG_PASSWORD:?set in .env}
      PAYROLL_OWNER_PASSWORD: ${PAYROLL_OWNER_PASSWORD:?set in .env}
      PAYROLL_READER_PASSWORD: ${PAYROLL_READER_PASSWORD:?set in .env}
    volumes:
      - ./payroll/init:/init:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in /init/*.sql; do
          echo "Running $$f"
          psql -v ON_ERROR_STOP=1 -v owner_pw="$$PAYROLL_OWNER_PASSWORD" -v reader_pw="$$PAYROLL_READER_PASSWORD" -f "$$f" || exit 1
        done
    restart: "no"

  # Optional: direct access through Cloudflare Tunnel (HTTP(S) services such as Splunk web/REST/HEC).
  # Route public hostnames to http://splunk:8000, https://splunk:8089 (noTLSVerify), https://splunk:8088 in the tunnel config.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  sqlserver-data:
  splunk-etc:
  splunk-var:
  payroll-db:
